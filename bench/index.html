<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Bench</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c; --line: #d8d8d8; --accent: #0b5cad; --warn-bg: #fff1d6; --warn-fg: #6b4400; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #ececec; --muted: #a8a8a8; --line: #3a3a3a; --accent: #6fb0f5; --warn-bg: #3d2e0a; --warn-fg: #ffd98a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; max-width: 720px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.lede { color: var(--muted); margin: 0 0 16px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 12px; }
  label { display: block; margin: 6px 0; }
  input[type=file], select { max-width: 100%; }
  button { font: inherit; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; margin: 0 8px 8px 0; min-height: 44px; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.5; }
  #crash { background: var(--warn-bg); color: var(--warn-fg); padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; }
  #progress { color: var(--muted); min-height: 1.5em; }
  pre, textarea { width: 100%; font: 12px/1.4 ui-monospace, monospace; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; white-space: pre-wrap; word-break: break-word; }
  textarea { height: 220px; }
</style>
</head>
<body>
<h1>On-device ASR + export bench</h1>
<p class="lede">Measures Whisper speech-to-text and a 30 s 1080×1920 H.264 export on this device. Nothing is uploaded; a local file stays on the phone. Keep the screen on until it says "done".</p>
<div id="crash" hidden></div>
<fieldset>
  <label><input type="checkbox" id="opt-asr" checked> Run ASR (downloads Whisper from Hugging Face, about 40 to 200 MB)</label>
  <label><input type="checkbox" id="opt-720"> Also run the 720×1280 export when 1080×1920 succeeds</label>
  <label>Optional own clip (stays on this device): <input type="file" id="file" accept="video/*,audio/*"></label>
  <label>Clip language for ASR: <select id="lang"><option value="arabic">Arabic</option><option value="english">English</option><option value="">Auto-detect</option></select></label>
</fieldset>
<button id="run">Run benchmark</button><button id="copy" class="secondary">Copy results</button>
<p id="progress">idle</p>
<h2>Summary</h2>
<pre id="summary"></pre>
<ul id="downloads"></ul>
<h2>Results JSON</h2>
<textarea id="json" readonly></textarea>
<script type="module" src="./bench.js"></script>
</body>
</html>
