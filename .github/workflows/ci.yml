# CI (ADR-0002: Python floor 3.12). Two jobs:
#   test     lint + unit tests on the floor (3.12) and the .venv minor version (3.14), core + dev lock only.
#   runtime  the full runtime lock (requirements.txt: PuLP, numpy, av, faster-whisper, scenedetect, opencv)
#            on 3.12 and 3.14, so every pinned runtime dep is import-tested (tests/unit/test_runtime_imports.py,
#            enabled by VAC_FULL_RUNTIME=1). apt coinor-cbc only, because PuLP 4 bundles no CBC and the
#            MILP smoke test solves one problem. No ffmpeg: no current test calls it.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      VAC_FULL_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CBC (PuLP 4 does not bundle it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coinor-cbc
      - name: Install full runtime lock + dev
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Test (runtime imports enabled)
        run: python -m pytest -q
